[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agribusiness-datascience-strategy"
version = "1.0.0"
description = "Production-grade 4-Week Agribusiness Data Science & Strategy Curriculum"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anirban", email = "anirban4ru@gmail.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "tabulate>=0.9.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0"
]
